<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Overlay TikTok Mekirs</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 720px;
      height: 1280px;
      background: transparent;
      overflow: hidden;
    }

    .canvas {
      position: relative;
      width: 720px;
      height: 1280px;
    }

    iframe {
      position: absolute;
      border: none;
      background: transparent;
    }

    /* 🎆 FUEGOS */
    .firework {
      top: -30px;
      left: 50%;
      transform: translateX(-50%) scale(1.5);
      width: 720px;
      height: 250px;
      pointer-events: none;
      z-index: 10;
    }

    /* 🔥 ACCIONES */
    .acciones {
      top: 65px;
      left: 50%;
      transform: translateX(-50%);
      width: 520px;
      height: 150px;
      z-index: 5;
    }

    /* 🔔 ALERTS */
    .alerts {
      top: 120px;
      left: 50%;
      transform: translateX(-50%) scale(0.95);
      width: 500px;
      height: 200px;
      z-index: 6;
    }

    /* 💬 CHAT */
    .chat-wrap {
      position: absolute;
      top: 60px;
      left: -5px;
      width: 270px;
      height: 420px;
      overflow: visible;
      z-index: 7;
    }

    .chat-wrap iframe {
      top: 0px;
      left: 0;
      width: 300px;
      height: 460px;
      transform: scale(0.9);
      transform-origin: top left;
    }

    /* 💰 TOP GIFTERS (derecha) */
    .topgifter {
      top: 60px;
      right: -20px;
      width: 390px;
      height: 270px;
      transform: scale(0.98);
      z-index: 8;
    }

    /* ❤️ TOP LIKES (derecha, un poco más arriba) */
    .topliker {
      top: 300px; /* 🔼 subido un poco */
      right: -20px;
      width: 390px;
      height: 270px;
      transform: scale(0.98);
      z-index: 8;
    }

    /* 🎯 META */
    .meta {
      top: 520px;
      left: -60px;
      width: 500px;
      height: 200px;
      transform: scale(0.85);
    }

  </style>
</head>

<body>
  <div class="canvas">

    <iframe class="firework"
      src="https://tikfinity.zerody.one/widget/firework?cid=1638627"></iframe>

    <iframe class="acciones"
      src="https://tikfinity.zerody.one/widget/myactions?cid=1638627&screen=1"></iframe>

    <iframe class="alerts"
      src="https://app.streamtoearn.io/overlay/6a507be13a91eda3b1c241c9/alerts/1"></iframe>

    <!-- CHAT -->
    <div class="chat-wrap">
      <iframe src="https://tikfinity.zerody.one/widget/chat?cid=1638627"></iframe>
    </div>

    <iframe class="topgifter"
      src="https://tikfinity.zerody.one/widget/topgifter?cid=1638627"></iframe>

    <iframe class="topliker"
      src="https://tikfinity.zerody.one/widget/topliker?cid=1638627"></iframe>

    <iframe class="meta"
      src="https://tikfinity.zerody.one/widget/goal?cid=1638627&metric=coins"></iframe>

  </div>
</body>
</html>
