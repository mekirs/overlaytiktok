<!DOCTYPE html>
<html lang="es">
<meta http-equiv="Content-Security-Policy" content="frame-src * https://streamlabs.com https://*.streamlabs.com;">
  <head>
  <meta charset="UTF-8" />
  <title>Overlay TikTok Mekirs</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 720px;
      height: 1280px;
      background: transparent;
      overflow: hidden;
    }

    .canvas {
      position: relative;
      width: 720px;
      height: 1280px;
    }

    iframe {
      position: absolute;
      border: none;
      background: transparent;
    }

    .acciones {
      top: 65px;
      left: 50%;
      transform: translateX(-50%);
      width: 520px;
      height: 150px;
      z-index: 5;
    }

.chattiktok { 
     position: absolute;
      top: 60px;
      left: -5px;
      width: 270px;
      height: 300px;
      overflow: visible;
      z-index: 7;
    }

    .chattiktok iframe {
      top: 0px;
      left: 0;
      width: 300px;
      height: 300px;
      transform: scale(0.9);
      transform-origin: top left;
    }


    /* 💰 TOP GIFTERS (IZQUIERDA pegado al filo) */
    .topgifter {
      top: 70px;
      right: -150px;   /* 🔥 pegado al borde */
      width: 390px;
      height: 220px;
      transform: scale(0.98);
      z-index: 8;
    }

    /* ❤️ TOP LIKES (IZQUIERDA más abajo) */
    .topliker {
      top: 300px;
      right: -150px;   /* 🔥 pegado al borde */
      width: 390px;
      height: 220px;
      transform: scale(0.98);
      z-index: 8;
    }

    /* 🎯 META */
    .meta {
      top: 520px;
      left: -60px;
      width: 500px;
      height: 200px;
      transform: scale(0.85);
    }

    /* 🎥 EVENTOS YOUTUBE (centro) */
    .yt-events {
      top: 400px;
      left: 50%;
      transform: translateX(-50%);
      width: 520px;
      height: 500px;
      z-index: 9;
    }

    
    .yt-chat {
      position: absolute;
      top: 320px;
      left: -5px;
      width: 270px;
      height: 220px;
      overflow: visible;
      z-index: 7;
    }

    .yt-chat iframe {
      width: 300px;
      height: 260px;
      transform: scale(0.9);
      transform-origin: top left;
    }

    
  </style>
</head>

<body>
  <div class="canvas">

    <iframe class="acciones"
      src="https://tikfinity.zerody.one/widget/myactions?cid=1638627&screen=1"></iframe>

    <div class="chattiktok">
      <iframe src="https://tikfinity.zerody.one/widget/chat?cid=1638627"></iframe>
    </div>

    <iframe class="topgifter"
      src="https://tikfinity.zerody.one/widget/topgifter?cid=1638627"></iframe>

    <iframe class="topliker"
      src="https://tikfinity.zerody.one/widget/topliker?cid=1638627"></iframe>

    <iframe class="meta"
      src="https://tikfinity.zerody.one/widget/goal?cid=1638627&metric=coins"></iframe>

   <iframe class="yt-events"
      src="https://streamlabs.com/alert-box/v3/DDE91FC3A4933789200B748CF697FA24AC208CC50458DAD18CA90CFF84421A650438A82C24978359D012AAECBBF5A545A56A031B2187F3306BA91B9F15214A56AF12B902C907DAE8CABC2A7C1ADF689F2E873975BAF341B79960D6A8598C4555C5A4E8FFA77DC8CBAC3B4D52BEB0EE419274B92485800559009B9FAC04"></iframe>

    <div class="yt-chat">
      <iframe src="https://streamlabs.com/widgets/chat-box/v1/DDE91FC3A4933789200B748CF697FA24AC208CC50458DAD18CA90CFF84421A650438A82C24978359D012AAECBBF5A545A56A031B2187F3306BA91B9F15214A56AF12B902C907DAE8CABC2A7C1ADF689F2E873975BAF341B79960D6A8598C4555C5A4E8FFA77DC8CBAC3B4D52BEB0EE419274B92485800559009B9FAC04"></iframe>
    </div>
    
  </div>
</body>
</html>
