<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 720px;
    height: 1280px;
    background: transparent;
    overflow: hidden;
  }

  .canvas {
    position: relative;
    width: 720px;
    height: 1280px;
  }

  iframe {
    position: absolute;
    border: none;
    background: transparent;
  }

  /* 🎆 FUEGOS */
  .firework {
    top: -30px;
    left: 50%;
    transform: translateX(-50%) scale(1.5);
    width: 720px;
    height: 250px;
    pointer-events: none;
    z-index: 10;
  }

  /* 🔔 ALERTS */
  .alerts {
    top: 140px;
    left: 50%;
    transform: translateX(-50%) scale(0.9);
    width: 500px;
    height: 200px;
    z-index: 6;
  }

  /* 🔥 ACCIONES */
  .acciones {
    top: 80px;
    left: 50%;
    transform: translateX(-50%);
    width: 500px;
    height: 150px;
    z-index: 5;
  }

  /* 💬 CHAT (ARREGLADO) */
  .chat-wrap {
    position: absolute;
    top: 310px;
    left: 0px;
    width: 280px;
    height: 420px;
    overflow: visible; /* 👈 clave */
  }

  .chat-wrap iframe {
    width: 280px;
    height: 420px;
    transform: scale(0.85);
    transform-origin: top left;
    top: 0; /* 👈 quitado el -40 */
    left: 0;
  }

  /* 💰 TOP GIFTERS (más grande y más arriba) */
  .topgifter {
    top: 120px;
    right: -40px;
    width: 340px;
    height: 230px;
    transform: scale(0.95);
  }

  /* ❤️ TOP LIKERS (más grande y alineado) */
  .topliker {
    top: 340px;
    right: -40px;
    width: 340px;
    height: 230px;
    transform: scale(0.95);
  }

  /* 🎯 META */
  .meta {
    top: 560px;
    left: -60px;
    width: 500px;
    height: 200px;
    transform: scale(0.85);
  }
</style>
